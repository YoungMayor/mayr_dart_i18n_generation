name: mayr_i18n_generation
description: Provide automatic type-safe translation key generation for projects using mayr_i18n.
version: 1.0.0
homepage: https://github.com/YoungMayor/mayr_dart_i18n_generation
repository: https://github.com/YoungMayor/mayr_dart_i18n_generation
issue_tracker: https://github.com/YoungMayor/mayr_dart_i18n_generation/issues
documentation: https://github.com/YoungMayor/mayr_dart_i18n_generation/wiki
LICENSE: MIT

environment:
  sdk: ^3.9.2

dependencies:
  analyzer: ^6.0.0
  build: ^2.4.0
  source_gen: ^1.5.0
  path: ^1.9.0
  yaml: ^3.1.0
  args: ^2.4.0
  glob: ^2.1.0

dev_dependencies:
  build_runner: ^2.4.0
  lints: ^6.0.0
  test: ^1.25.6

executables:
  mayr_i18n_generator:
  generate: generate
  verify: verify
  sync: sync
  audit: audit
  create: create

topics:
  - i18n
  - dart
  - json-translation
  - productivity
  - development
